[package]
name = "charon-ssh"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "SSH transport, PTY sessions and host-key TOFU, extracted from charon so other applications can share one implementation"

# Deliberately free of tauri, rusqlite, serialport and portable-pty. Everything
# this crate knows how to do is expressed over plain channels and traits, so the
# application on top decides how output reaches a UI and how a user is asked
# about an unknown host key. charon emits Tauri events; hvm-desk does something
# else; neither difference belongs in here.

[dependencies]
anyhow = "1"
async-trait = "0.1"
# 0.65: RUSTSEC-2026-0153 (russh-cryptovec; remote DoS of clients and servers
# before 0.58) and RUSTSEC-2026-0154 (agent frames) are fixed from 0.60.3.
# russh-keys is part of russh since 0.46 (`russh::keys`).
# Crypto backend: `ring`, not the default aws-lc-rs, which needs NASM to build
# on Windows (and cmake elsewhere). `rsa` and `flate2` are the other defaults.
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
# russh-sftp works over any AsyncRead/AsyncWrite stream and doesn't depend on
# russh, so it stays on the 2.x line this crate was written against.
russh-sftp = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "fs", "io-util"] }
tracing = "0.1"
dirs = "5"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
