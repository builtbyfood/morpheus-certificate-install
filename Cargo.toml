# morpheus-certificate-install 0.4.2
[workspace]
members = ["crates/mci-core", "crates/mci-cli", "src-tauri"]
resolver = "2"

[workspace.dependencies]
# charon-ssh: the SSH client, from https://github.com/builtbyfood/charon-ssh, pinned to the 0.2.1
# commit (a host key of another type is a changed key). Cargo.lock records the same commit.
charon-ssh = { git = "https://github.com/builtbyfood/charon-ssh", rev = "986a44ef5eca828a423943f625c9139dfd84b991" }

# Profiles only take effect in the workspace root (cargo ignores them in member crates).
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
