# morpheus-certificate-install 0.4.1
# audit: `cargo audit` on the whole workspace's Cargo.lock, every Monday and on demand (Actions → audit →
# Run workflow). A new RustSec advisory against a dependency then shows up as a failed scheduled run,
# not on release day. Ignored advisories, each with its reason, are in .cargo/audit.toml; "unmaintained"
# and "unsound" warnings (the Linux GTK stack's) are reported but don't fail the run.
# The build workflow (build.yml) runs the same audit on every push, PR and tag.
# GitHub disables scheduled workflows in a public repository after 60 days without activity; it
# e-mails the owner first, and the workflow can be re-enabled from the Actions tab.
name: audit

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC (off the hour, when the scheduler is less busy)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-audit }
      - name: cargo audit (always the latest advisory database)
        run: cargo audit
